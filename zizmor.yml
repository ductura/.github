# Exceptions for zizmor in self-test.yml (DAN-1078). Every entry needs a reason;
# a finding is fixed in the workflow unless it is listed here.
rules:
  # Reason: self-test.yml calls this repository's reusable workflows as
  # `./.github/workflows/<file>.yml`, which GitHub resolves at the same commit,
  # so the `$/` spelling adds no protection here. The pinned actionlint
  # (v1.7.7) does not read `$/`, and scripts/ci-ok.test.mjs asserts the `./`
  # calls (ci-ok-reusable, node-fail).
  self-repository:
    ignore:
      - self-test.yml
  # Reason: a job without `name` (and a reusable workflow's only job) shows up
  # under its id, and the ids are the check names other repositories and the
  # required status read (`ci-ok`, `<caller> / node`, `<caller> / gitleaks`).
  # A `name` would be a second spelling that can drift from the id, and on a
  # matrix job it would drop the matrix values from the check name. Listed per
  # file, so a new workflow without names is still a finding.
  anonymous-definition:
    ignore:
      - ci-node.yml
      - ci-ok.yml
      - dependency-review.yml
      - drift-check.yml
      - osv-scan.yml
      - secret-scan.yml
      - self-test.yml
  # Reason: self-test.yml has no concurrency group on purpose. Every pushed
  # head keeps its own complete run, so `ci-ok` on each head SHA is a result
  # and never "cancelled"; review and QA cite CI per full SHA. The reusable
  # gate workflows set their own groups.
  concurrency-limits:
    ignore:
      - self-test.yml
