# Generated by ductura/.github scripts/new-repo (preset generic).
# Shared workflows are called by full SHA; the tag is only a comment.
name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  secret-scan:
    uses: ductura/.github/.github/workflows/secret-scan.yml@%%ref%% # %%refLabel%%

  dependency-review:
    if: ${{ github.event_name == 'pull_request' }}
    uses: ductura/.github/.github/workflows/dependency-review.yml@%%ref%% # %%refLabel%%

  ci-ok:
    if: ${{ always() }}
    needs: [secret-scan, dependency-review]
    uses: ductura/.github/.github/workflows/ci-ok.yml@%%ref%% # %%refLabel%%
    with:
      results: ${{ toJSON(needs) }}
      # dependency-review runs only on pull requests; there it must not be skipped.
      allow-skipped: ${{ github.event_name != 'pull_request' && 'dependency-review' || '' }}
