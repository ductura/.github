# Reusable aggregate check: one required status that is green only when every
# job it depends on succeeded. Skipped jobs fail unless named in allow-skipped,
# because a skipped required job must not count as passed.
# Caller (the job must run even when a dependency failed or was cancelled):
#   ci-ok:
#     if: ${{ always() }}
#     needs: [lint, test]
#     uses: ductura/.github/.github/workflows/ci-ok.yml@<40-char SHA> # <tag>
#     with:
#       results: ${{ toJSON(needs) }}
name: ci-ok
on:
  workflow_call:
    inputs:
      results:
        description: The caller's needs context as JSON, i.e. toJSON(needs)
        type: string
        required: true
      allow-skipped:
        description: Job ids that may be skipped, separated by spaces or newlines
        type: string
        default: ""
permissions: {}
jobs:
  ci-ok:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every needed job succeeded
        shell: bash
        env:
          RESULTS: ${{ inputs.results }}
          ALLOW_SKIPPED: ${{ inputs.allow-skipped }}
        run: |
          # ci-ok:begin
          set -euo pipefail
          if ! jq -e 'type == "object" and length > 0' >/dev/null 2>&1 <<< "$RESULTS"; then
            echo "::error::results must be a non-empty JSON object; pass toJSON(needs) from a job with needs"
            exit 1
          fi
          allowed="$(tr -s ' \t\r\n' '\n' <<< "$ALLOW_SKIPPED" | sed '/^$/d' | jq -R . | jq -sc .)"
          problems="$(jq -r --argjson allowed "$allowed" '
            (($allowed - keys) | map("allow-skipped names a job that is not in needs: \(.)"))
            + (to_entries | map(
                ((.value | objects | .result) // "missing") as $r
                | if $r == "success" then empty
                  elif $r == "skipped" and (.key as $k | $allowed | index($k)) then empty
                  else "job \(.key) result: \($r)" end))
            | .[]' <<< "$RESULTS")"
          if [ -n "$problems" ]; then
            while IFS= read -r line; do echo "::error::$line"; done <<< "$problems"
            exit 1
          fi
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$RESULTS"
          echo "ci-ok: $(jq length <<< "$RESULTS") job(s) passed"
          # ci-ok:end
