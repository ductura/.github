# Reusable Node CI for Ductura repositories: pnpm, Node from .nvmrc, read-only token.
# Caller: jobs.<id>.uses: ductura/.github/.github/workflows/ci-node.yml@<40-char SHA> # <tag>
# The caller job must grant `permissions: { contents: read, packages: read }`:
# installing @ductura/* from GitHub Packages needs a token even to read.
# setup-node writes it to a user-level .npmrc (NPM_CONFIG_USERCONFIG) as
# ${NODE_AUTH_TOKEN}; pnpm ignores env tokens in a repository .npmrc.
name: ci-node
on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory with package.json, pnpm-lock.yaml and .nvmrc
        type: string
        default: "."
      scripts:
        description: Package scripts to run in order, separated by spaces or newlines
        type: string
        default: "typecheck test"
      expect-failure:
        description: Self-test only (DAN-971). Green only if a package script failed; the install must still pass
        type: boolean
        default: false
    outputs:
      scripts-result:
        description: success, or failure if a package script failed
        value: ${{ jobs.node.outputs.scripts-result }}
permissions:
  contents: read
  packages: read
jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      scripts-result: ${{ steps.scripts.outputs.scripts-result }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ${{ inputs.working-directory }}/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ inputs.working-directory }}/.nvmrc
          cache: pnpm
          cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml
          registry-url: https://npm.pkg.github.com
          scope: "@ductura"
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
      - name: Package scripts
        id: scripts
        env:
          SCRIPTS: ${{ inputs.scripts }}
          EXPECT_FAILURE: ${{ inputs.expect-failure }}
        run: |
          # ci-node-scripts:begin
          set -uo pipefail
          read -ra names <<< "${SCRIPTS//[$'\r\n']/ }"
          if [ "${#names[@]}" -eq 0 ]; then
            echo "::error::input 'scripts' is empty"
            exit 1
          fi
          result=success
          for name in "${names[@]}"; do
            echo "::group::pnpm run $name"
            pnpm run "$name" || result=failure
            echo "::endgroup::"
            [ "$result" = success ] || break
          done
          echo "scripts-result=$result" >> "$GITHUB_OUTPUT"
          if [ "$EXPECT_FAILURE" = true ]; then
            if [ "$result" = success ]; then
              echo "::error::expect-failure is set, but every script passed"
              exit 1
            fi
            echo "pnpm run $name failed, as expect-failure requires"
          elif [ "$result" = failure ]; then
            echo "::error::pnpm run $name failed"
            exit 1
          fi
          # ci-node-scripts:end
