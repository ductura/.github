# Reusable Node CI for Ductura repositories: pnpm, Node from .nvmrc, read-only token.
# Caller: jobs.<id>.uses: ductura/.github/.github/workflows/ci-node.yml@<40-char SHA> # <tag>
name: ci-node
on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory with package.json, pnpm-lock.yaml and .nvmrc
        type: string
        default: "."
      scripts:
        description: Package scripts to run in order, separated by spaces or newlines
        type: string
        default: "typecheck test"
permissions:
  contents: read
jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ${{ inputs.working-directory }}/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ inputs.working-directory }}/.nvmrc
          cache: pnpm
          cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Package scripts
        env:
          SCRIPTS: ${{ inputs.scripts }}
        run: |
          set -euo pipefail
          read -ra names <<< "${SCRIPTS//$'\n'/ }"
          if [ "${#names[@]}" -eq 0 ]; then
            echo "::error::input 'scripts' is empty"
            exit 1
          fi
          for name in "${names[@]}"; do
            echo "::group::pnpm run $name"
            pnpm run "$name"
            echo "::endgroup::"
          done
