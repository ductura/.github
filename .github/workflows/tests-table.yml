# Reusable check (DAN-948): a PR that changes code must carry a filled
# "## Testovi prihvata" table in its description; a docs-only PR passes.
# Rules and tests: scripts/tests-table.mjs. Body and files are read fresh from
# the API; it checks out only this repository at tool-sha, never PR code.
# Caller (pull_request_target from its default branch, so a PR cannot edit
# the check away; `edited` re-runs it when the body or the base changes):
#   on:
#     pull_request_target: { types: [opened, edited, synchronize, reopened] }
#   jobs:
#     tests-table:
#       permissions: { contents: read, pull-requests: read }
#       uses: ductura/.github/.github/workflows/tests-table.yml@<40-char SHA> # <tag>
#       with:
#         tool-sha: <the same 40-char SHA>
# `self-test` is for this repository's self-test.yml only: the runner then
# talks to a local fake API over fixtures/tests-table/<case>.json, never to GitHub.
name: tests-table
on:
  workflow_call:
    inputs:
      tool-sha:
        description: The full SHA of this repository the caller pins in `uses:`
        type: string
        required: true
      self-test:
        description: Fixture case under fixtures/tests-table; only in ductura/.github, never with a real token
        type: string
        default: ""
permissions: {}
jobs:
  tests-table:
    name: Tests table
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # One evaluation per PR at a time; a newer event replaces an older run.
    # Self-test cases run side by side: each has its own group.
    concurrency:
      group: tests-table-${{ github.repository }}-${{ inputs.self-test != '' && format('self-test-{0}-{1}', inputs.self-test, github.run_id) || github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Inputs are valid
        shell: bash
        env:
          TOOL_SHA: ${{ inputs.tool-sha }}
          SELF_TEST: ${{ inputs.self-test }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! [[ "$TOOL_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::tool-sha must be a full 40-character commit SHA"
            exit 1
          fi
          if [ -n "$SELF_TEST" ]; then
            if [ "$REPOSITORY" != "ductura/.github" ]; then
              echo "::error::self-test runs only in ductura/.github"
              exit 1
            fi
            if ! [[ "$SELF_TEST" =~ ^[a-z0-9-]+$ ]]; then
              echo "::error::self-test must name a case in fixtures/tests-table"
              exit 1
            fi
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ductura/.github
          ref: ${{ inputs.tool-sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Code PR has a filled tests table
        if: ${{ inputs.self-test == '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/tests-table.mjs
      - name: Self-test the runner over a fixture (local fake API, no token)
        if: ${{ inputs.self-test != '' }}
        env:
          SELF_TEST: ${{ inputs.self-test }}
        run: node scripts/tests-table-self-test.mjs "fixtures/tests-table/$SELF_TEST.json"
