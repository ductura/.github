# Reusable dependency review: fails a pull request that adds a dependency with
# a known vulnerability or a licence outside the allow list. It looks only at
# what the PR changes; read-only, results are in the job summary.
# Outside a pull_request event there is nothing to compare, so the job fails;
# call it from a workflow that runs on pull_request.
# Caller: jobs.<id>.uses: ductura/.github/.github/workflows/dependency-review.yml@<40-char SHA> # <tag>
name: dependency-review
on:
  workflow_call:
    inputs:
      fail-on-severity:
        description: Lowest vulnerability severity that fails (low, moderate, high, critical)
        type: string
        default: moderate
      allow-licenses:
        description: Comma-separated SPDX licences that are allowed
        type: string
        default: MIT, ISC, Apache-2.0, BSD-2-Clause, BSD-3-Clause, 0BSD, MPL-2.0, BlueOak-1.0.0, CC0-1.0, CC-BY-4.0, Python-2.0
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require a pull_request event
        if: github.event_name != 'pull_request'
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          echo "::error::dependency-review needs a pull_request event, got $EVENT_NAME"
          exit 1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: ${{ inputs.fail-on-severity }}
          allow-licenses: ${{ inputs.allow-licenses }}
