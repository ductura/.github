# Checks this repository's own workflows and runs the reusable ones over fixtures.
name: self-test
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint (verified by the Go checksum database)
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - name: actionlint
        run: '"$(go env GOPATH)/bin/actionlint" -color'

  pin-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install the test dependencies (package-lock.json, no scripts)
        run: npm ci --ignore-scripts
      - name: pin-check tests
        run: node --test scripts/*.test.mjs
      - name: Every action pinned to a full SHA
        run: node scripts/pin-check.mjs .github/workflows

  # Every job of every workflow has permissions of its own or from its file (DAN-970).
  permissions-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install the YAML parser (package-lock.json, no scripts)
        run: npm ci --ignore-scripts
      - name: Every job has permissions
        run: node scripts/permissions-check.mjs .github/workflows

  # Verdict core and runner of the engineering gate (scripts/gate) over invented PRs.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Gate tests
        run: node --test scripts/gate/*.test.ts

  # The reusable engineering-gate.yml itself, called with real inputs over
  # fixtures/gate: the cases that must pass and those that must stay pending
  # or fail. Local fake API only; no token reaches the runner.
  engineering-gate:
    strategy:
      fail-fast: false
      matrix:
        case: [pass-standard, pass-override, no-verdict, stale-head, fail-on-head, bad-agent-format]
        include:
          - { case: fork-head }
          - { case: api-error }
          - { case: pass-critical, risk: critical, trusted: qa-person-y }
          - { case: critical-no-qa, risk: critical }
          - { case: below-floor, risk: critical }
          - { case: floor-stale, floor: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb }
    permissions: { contents: read, issues: read, pull-requests: read, statuses: write }
    uses: ./.github/workflows/engineering-gate.yml
    with:
      gate-sha: ${{ github.event.pull_request.head.sha || github.sha }}
      owner-login: owner-x
      minimum-risk: ${{ matrix.risk || 'standard' }}
      floor-sha: ${{ matrix.floor || 'cccccccccccccccccccccccccccccccccccccccc' }}
      trusted-logins: ${{ matrix.trusted || '' }}
      self-test: ${{ matrix.case }}

  node-ok:
    permissions: { contents: read, packages: read }
    uses: ./.github/workflows/ci-node.yml
    with:
      working-directory: fixtures/node-ok

  node-ok-multiline:
    permissions: { contents: read, packages: read }
    uses: ./.github/workflows/ci-node.yml
    with:
      working-directory: fixtures/node-ok
      scripts: |
        typecheck
        test

  # A Node project whose test fails on purpose (DAN-971): ci-node.yml stays
  # green only because expect-failure asserts that the test failed.
  node-fail:
    permissions: { contents: read, packages: read }
    uses: ./.github/workflows/ci-node.yml
    with:
      working-directory: fixtures/node-fail
      scripts: test
      expect-failure: true

  # A required job that never runs; ci-ok must not count it as passed.
  node-skipped:
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo never runs

  # ci-ok.yml's exact block must be red over the failed test and over the
  # skipped job. Logic tested in scripts/ci-node.test.mjs.
  red-aggregate:
    if: ${{ always() }}
    needs: [node-fail, node-skipped]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: ci-ok is red over a failed test and a skipped job
        shell: bash
        env:
          RESULTS: ${{ toJSON(needs) }}
          SCRIPTS_RESULT: ${{ needs.node-fail.outputs.scripts-result }}
        run: |
          # red-aggregate:begin
          set -euo pipefail
          node scripts/extract-run.mjs .github/workflows/ci-ok.yml ci-ok > "$RUNNER_TEMP/ci-ok.sh"
          node_fail="$(jq -r '."node-fail".result' <<< "$RESULTS")"
          if [ "$node_fail" != success ]; then
            echo "::error::node-fail result: $node_fail (its test must fail, its install must pass)"
            exit 1
          fi
          expect_red() {
            local out
            if out="$(RESULTS="$2" ALLOW_SKIPPED="" bash "$RUNNER_TEMP/ci-ok.sh" 2>&1)"; then
              echo "::error::ci-ok passed over $1"
              exit 1
            fi
            if ! grep -qxF "::error::job $1" <<< "$out"; then
              while IFS= read -r line; do echo "> $line"; done <<< "$out"
              echo "::error::ci-ok failed over $1 for another reason"
              exit 1
            fi
            echo "ci-ok is red over $1"
          }
          expect_red "node-fail result: failure" "$(jq -c --arg r "$SCRIPTS_RESULT" '{"node-fail": (."node-fail" + {result: $r})}' <<< "$RESULTS")"
          expect_red "node-skipped result: skipped" "$(jq -c '{"node-skipped": ."node-skipped"}' <<< "$RESULTS")"
          # red-aggregate:end

  presets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: fixtures/node-ok
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: fixtures/node-ok/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: fixtures/node-ok/.nvmrc
          cache: pnpm
          cache-dependency-path: fixtures/node-ok/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Preset rejects implicit any and unchecked index access
        run: |
          set +e -uo pipefail
          # Expected errors must not become PR annotations via setup-node's tsc matcher.
          echo "::remove-matcher owner=tsc::"
          out="$(./node_modules/.bin/tsc -p presets-fail/tsconfig.json)"
          status=$?
          echo "$out"
          if [ "$status" -eq 0 ]; then
            echo "::error::presets-fail compiled; the preset is not strict"
            exit 1
          fi
          codes="$(grep -o 'error TS[0-9]*' <<< "$out" | sort -u | tr '\n' ' ')"
          if [ "$codes" != "error TS2532 error TS7006 " ]; then
            echo "::error::expected exactly TS2532 and TS7006, got: $codes"
            exit 1
          fi

  secret-scan:
    uses: ./.github/workflows/secret-scan.yml

  # Runs the scan script that secret-scan.yml ships against throwaway repos.
  secret-scan-negative:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Clean repo passes, a leak and a folder without history fail
        shell: bash
        run: |
          set -euo pipefail
          scan="$RUNNER_TEMP/scan.sh"
          node scripts/extract-run.mjs .github/workflows/secret-scan.yml secret-scan > "$scan"
          root="$(mktemp -d "$RUNNER_TEMP/scan.XXXXXX")"
          mkdir "$root/clean" "$root/leak" "$root/plain"
          commit() { git -C "$1" init -q && git -C "$1" add . && git -C "$1" -c user.name=CI -c user.email=ci@example.invalid commit -qm fixture; }
          echo "nothing secret" > "$root/clean/readme.txt"
          commit "$root/clean"
          # A random token in the GitHub PAT shape, made now and never committed to this repo.
          printf 'token = "ghp_%s"\n' "$(openssl rand -hex 18)" > "$root/leak/config.txt"
          commit "$root/leak"
          echo "nothing secret" > "$root/plain/readme.txt"
          SCAN_DIR="$root/clean" bash "$scan"
          expect_fail() {
            local out
            if out="$(SCAN_DIR="$root/$1" bash "$scan" 2>&1)"; then
              echo "$out"; echo "::error::scan passed the $1 case"; exit 1
            fi
            echo "$out"
            grep -qE "$2" <<< "$out" || { echo "::error::$1 failed for another reason"; exit 1; }
          }
          expect_fail leak 'leaks found: [1-9]'
          expect_fail plain 'scanned no commits'

  osv-scan:
    uses: ./.github/workflows/osv-scan.yml
    with:
      path: fixtures/osv/clean

  # Runs the block osv-scan.yml ships: a lockfile with a known vulnerability
  # (built here, never committed) and a folder without one fail (DAN-921).
  osv-scan-negative:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: A vulnerable lockfile and a folder without one fail, a clean one passes
        shell: bash
        run: |
          set -euo pipefail
          scan="$RUNNER_TEMP/osv.sh"
          node scripts/extract-run.mjs .github/workflows/osv-scan.yml osv-scan > "$scan"
          root="$(mktemp -d "$RUNNER_TEMP/osv.XXXXXX")"
          mkdir "$root/vulnerable" "$root/empty"
          cp -r fixtures/osv/clean "$root/clean"
          ln -s "$RUNNER_TEMP" "$root/escape"  # a real folder outside the scanned workspace
          # minimist 1.2.5: GHSA-xvch-5gv4-984h (prototype pollution), fixed in 1.2.6.
          printf '%s\n' "lockfileVersion: '9.0'" "importers:" "  .:" "    dependencies:" \
            "      minimist: {specifier: 1.2.5, version: 1.2.5}" "packages:" \
            "  minimist@1.2.5:" "    resolution: {integrity: sha512-FM9nNUYrRBAELZQT3xeZQ7fmMOBg6nWNmJKTcgsJeaLstP/UODVpGsr5OhXhhXg6f+qtJ8uiZ+PUxkDWcgIXLw==}" \
            "snapshots:" "  minimist@1.2.5: {}" > "$root/vulnerable/pnpm-lock.yaml"
          GITHUB_WORKSPACE="$root" SCAN_PATH=clean bash "$scan"
          expect_fail() {
            local out
            if out="$(GITHUB_WORKSPACE="$root" SCAN_PATH="$1" bash "$scan" 2>&1)"; then
              echo "$out"; echo "::error::scan passed the $1 case"; exit 1
            fi
            echo "$out"
            for want in "${@:2}"; do
              grep -qF -- "$want" <<< "$out" || { echo "::error::$1 failed without: $want"; exit 1; }
            done
          }
          expect_fail vulnerable "::error::osv-scanner found known vulnerabilities" GHSA-xvch-5gv4-984h
          expect_fail empty "::error::osv-scanner found no lockfile to scan"
          expect_fail ../x "::error::path must be relative"
          expect_fail escape "::error::path resolves outside the repository"

  dependency-review:
    if: ${{ github.event_name == 'pull_request' }}
    uses: ./.github/workflows/dependency-review.yml

  # Self-test of @ductura/eslint-config and @ductura/prettier-config over
  # fixtures/lint-presets (was presets-self-test.yml; needs cannot see
  # another workflow, so every job of a pull request lives here).
  lint-presets:
    permissions: { contents: read, packages: read }
    uses: ./.github/workflows/ci-node.yml
    with:
      working-directory: fixtures/lint-presets
      scripts: lint format typecheck test

  # The reusable ci-ok.yml called for real, as other repositories call it.
  ci-ok-reusable:
    if: ${{ always() }}
    needs: [actionlint, pin-check, permissions-check, gate, engineering-gate, node-ok, node-ok-multiline, node-fail, red-aggregate, presets, lint-presets, secret-scan, secret-scan-negative, osv-scan, osv-scan-negative, dependency-review]
    uses: ./.github/workflows/ci-ok.yml
    with:
      results: ${{ toJSON(needs) }}
      # dependency-review runs only on pull requests; there it must not be skipped.
      # '' is falsy in expressions, so `cond && '' || x` would always give x.
      allow-skipped: ${{ github.event_name != 'pull_request' && 'dependency-review' || '' }}

  # The required status: a plain job, because a reusable caller shows up as
  # "ci-ok / ci-ok" (DAN-885). It runs the exact block that ci-ok.yml ships.
  ci-ok:
    name: ci-ok
    if: ${{ always() }}
    needs: [actionlint, pin-check, permissions-check, gate, engineering-gate, node-ok, node-ok-multiline, node-fail, red-aggregate, presets, lint-presets, secret-scan, secret-scan-negative, osv-scan, osv-scan-negative, dependency-review, ci-ok-reusable]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Every needed job succeeded
        shell: bash
        env:
          RESULTS: ${{ toJSON(needs) }}
          ALLOW_SKIPPED: ${{ github.event_name != 'pull_request' && 'dependency-review' || '' }}
        run: |
          set -euo pipefail
          node scripts/extract-run.mjs .github/workflows/ci-ok.yml ci-ok > "$RUNNER_TEMP/ci-ok.sh"
          bash "$RUNNER_TEMP/ci-ok.sh"
