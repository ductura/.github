# Reusable secret scan: gitleaks over the full git history of the caller's
# repository. The image is pinned to a digest and runs without network.
# gitleaks exits 0 when git itself fails, so the step also requires that at
# least one commit was scanned.
# Caller: jobs.<id>.uses: ductura/.github/.github/workflows/secret-scan.yml@<40-char SHA> # <tag>
name: secret-scan
on:
  workflow_call:
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks (full history)
        shell: bash
        env:
          SCAN_DIR: ${{ github.workspace }}
        run: |
          # secret-scan:begin
          set -euo pipefail
          log="$(mktemp)"
          status=0
          docker run --rm --network none --user "$(id -u):$(id -g)" -v "$SCAN_DIR:/repo:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --redact --no-banner /repo > "$log" 2>&1 || status=$?
          cat "$log"
          if ! grep -qE '(^|[^0-9])[1-9][0-9]* commits? scanned' "$log"; then
            echo "::error::gitleaks scanned no commits; the scan did not run"
            exit 1
          fi
          exit "$status"
          # secret-scan:end
