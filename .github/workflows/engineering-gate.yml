# Reusable verdict check of the engineering gate (S-0.10-b, DAN-723): writes
# the commit status "Engineering review gate" on the PR head from the PR body
# and its review, QA and override comments. Rules: Ductus
# docs/ENGINEERING_SYSTEM.md §5 and §6; core in scripts/gate/verdicts.ts.
# Metadata only: it checks out this repository at gate-sha, never PR code,
# and needs no secret. The job stays green while the status says pending.
# Caller (pull_request_target and issue_comment, from its default branch):
#   gate:
#     needs: floor
#     permissions: { contents: read, issues: read, pull-requests: read, statuses: write }
#     uses: ductura/.github/.github/workflows/engineering-gate.yml@<40-char SHA> # gate-v1
#     with:
#       gate-sha: <the same 40-char SHA>
#       owner-login: <login of the owner>
#       minimum-risk: ${{ needs.floor.outputs.risk }}
#       floor-sha: ${{ needs.floor.outputs.head-sha }}
name: engineering-gate
on:
  workflow_call:
    inputs:
      gate-sha:
        description: The full SHA of this repository the caller pins in `uses:`
        type: string
        required: true
      owner-login:
        description: Login whose comments may override and carry verdicts
        type: string
        required: true
      minimum-risk:
        description: Risk floor of the changed paths (low, standard or critical), from the caller's path table
        type: string
        required: true
      floor-sha:
        description: The PR head SHA the floor was computed for; another head gets only pending
        type: string
        required: true
      trusted-logins:
        description: Further logins whose verdict comments count, separated by spaces or newlines
        type: string
        default: ""
permissions: {}
jobs:
  gate:
    name: Engineering gate evaluator
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # One evaluation per PR at a time, so an older run never overwrites the
    # status of a newer one; queued, never cancelled (no red evaluator).
    concurrency:
      group: engineering-gate-${{ github.repository }}-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: read
      pull-requests: read
      statuses: write
    steps:
      - name: gate-sha is a full commit SHA
        env:
          GATE_SHA: ${{ inputs.gate-sha }}
        run: |
          if ! [[ "$GATE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::gate-sha must be a full 40-character commit SHA"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ductura/.github
          ref: ${{ inputs.gate-sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Evaluate independent review and QA on the PR head
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GATE_OWNER_LOGIN: ${{ inputs.owner-login }}
          GATE_MINIMUM_RISK: ${{ inputs.minimum-risk }}
          GATE_FLOOR_SHA: ${{ inputs.floor-sha }}
          GATE_TRUSTED_LOGINS: ${{ inputs.trusted-logins }}
        run: node scripts/gate/review-gate.ts
