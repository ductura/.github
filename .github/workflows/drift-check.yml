# Weekly read-only check that Ductura repositories match drift/expected.json:
# default branch, branch protection, required ci-ok status and labels.yml.
# scan and report have only contents: read and never change a repository:
# scripts/drift.mjs sends nothing but GET and scripts/drift-report.mjs sends no
# request at all. The report job writes the outcome to the job summary and
# uploads it as the drift-report artifact. Drift and a scan that did not finish
# fail the run, so an unknown state never looks like "no drift". The deliver
# job is the only one with issue access: one comment on the issue numbered by the
# repository variable DRIFT_REPORT_ISSUE, and only when DRIFT_DELIVERY is
# "true" (off by default), in ductura/.github, on main (DAN-749).
name: drift-check
on:
  schedule:
    # Mondays 05:17 UTC.
    - cron: "17 5 * * 1"
  workflow_dispatch:
permissions: {}
concurrency:
  group: drift-check
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      status: ${{ steps.scan.outputs.status }}
      report: ${{ steps.scan.outputs.report }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Compare repository settings with drift/expected.json
        id: scan
        shell: bash
        env:
          # Public repositories are readable with this token; here it can only read (contents: read).
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          report="$RUNNER_TEMP/drift.md"
          node scripts/drift.mjs drift/expected.json --report-file "$report"
          code=$?
          set -e
          # 0 no drift, 1 drift found; anything else fails this job and the
          # report job reports "state unknown".
          case "$code" in
            0) status=clean ;;
            1) status=drift ;;
            *) exit "$code" ;;
          esac
          # The report file is clipped to 60 000 bytes, so it fits a job output and one variable.
          delim="REPORT_$(openssl rand -hex 16)"
          {
            echo "status=$status"
            echo "report<<$delim"
            cat "$report"
            echo "$delim"
          } >> "$GITHUB_OUTPUT"

  report:
    needs: scan
    # Also after a failed or cancelled scan: that outcome is reported as "state unknown".
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Write the scan outcome to the job summary and the report file
        env:
          SCAN_RESULT: ${{ needs.scan.result }}
          SCAN_STATUS: ${{ needs.scan.outputs.status }}
          REPORT: ${{ needs.scan.outputs.report }}
        # Exit 0 clean, 1 drift or unknown state, 2 the report could not be written.
        run: node scripts/drift-report.mjs --report-file "$RUNNER_TEMP/drift-report.md"
      - name: Upload the report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: drift-report
          path: ${{ runner.temp }}/drift-report.md
          if-no-files-found: error
          retention-days: 30

  deliver:
    needs: scan
    # After any scan outcome (an unfinished scan is delivered as "state unknown"), but only when
    # delivery is switched on, in this repository, from main, on the schedule or a manual run.
    if: ${{ always() && vars.DRIFT_DELIVERY == 'true' && github.repository == 'ductura/.github' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Comment drift or an unknown state on the report issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DRIFT_DELIVERY: ${{ vars.DRIFT_DELIVERY }}
          DRIFT_REPORT_ISSUE: ${{ vars.DRIFT_REPORT_ISSUE }}
          SCAN_RESULT: ${{ needs.scan.result }}
          SCAN_STATUS: ${{ needs.scan.outputs.status }}
          REPORT: ${{ needs.scan.outputs.report }}
        # Exit 0 delivered or nothing to deliver, 2 bad input or delivery failed.
        run: node scripts/drift-deliver.mjs
