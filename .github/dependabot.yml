# Weekly version updates, grouped (DAN-922). Cooldown as in Ductus: a release
# is proposed only after it has been public for a while, so a hijacked release
# is usually pulled first. Security updates are not delayed by cooldown.
# fixtures/** stay locked on purpose (node-fail must stay red).
# Checked by scripts/dependabot-check.mjs in self-test.yml (pin-check).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Zagreb
    cooldown:
      default-days: 7
    groups:
      # Its bump turns scripts/dependency-review.test.mjs red on purpose until the
      # licence matcher versions there are re-checked; alone, it blocks no other action.
      dependency-review:
        patterns: ["actions/dependency-review-action"]
      actions:
        patterns: ["*"]
    commit-message:
      prefix: chore

  - package-ecosystem: npm
    directories: ["/", "/packages/*"]
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Zagreb
    cooldown:
      default-days: 7
      semver-major-days: 30
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Pinned to dependency-review-action's own versions (DAN-1033); they move with it.
    ignore:
      - dependency-name: spdx-satisfies
      - dependency-name: spdx-expression-parse
      - dependency-name: spdx-license-ids
      - dependency-name: spdx-exceptions
    commit-message:
      prefix: chore
