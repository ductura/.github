# Weekly version updates, grouped (DAN-922). Cooldown as in Ductus: a release
# is proposed only after it has been public for a while, so a hijacked release
# is usually pulled first. Security updates are not delayed by cooldown.
# fixtures/** stay locked on purpose (node-fail must stay red).
# Checked by scripts/dependabot-check.mjs in self-test.yml (pin-check).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Zagreb
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: chore

  - package-ecosystem: npm
    directories: ["/", "/packages/*"]
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Zagreb
    cooldown:
      default-days: 7
      semver-major-days: 30
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore
